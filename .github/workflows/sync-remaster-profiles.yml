name: Sync remaster profiles

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DDrawCompat-MW3
        uses: actions/checkout@v4

      - name: Check out primary remaster repository
        uses: actions/checkout@v4
        with:
          repository: Icehellionx/MechWarrior-3-Remastered
          path: _remaster

      - name: Synchronize qualified profiles
        shell: pwsh
        run: |
          Copy-Item '_remaster/config/DDrawCompat.ini' 'profiles/MechWarrior3/DDrawCompat.ini' -Force
          Copy-Item '_remaster/config/DDrawCompat-PiratesMoon.ini' 'profiles/PiratesMoon/DDrawCompat.ini' -Force

      - name: Commit a changed profile snapshot
        shell: bash
        run: |
          if git diff --quiet -- profiles; then
            echo 'Profiles already match the primary remaster repository.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profiles
          git commit -m 'Sync compatibility profiles from primary remaster'
          git push
